sample:
  name: anomaly
common:
  platform_allow:
    - stm32f746g_disco
tests:
  sample.anomaly.emlearn.robot:
    extra_configs:
      - CONFIG_EMLEARN=y
      - CONFIG_ANOMALY_LIB_BACKEND_EMLEARN=y
      - CONFIG_ANOMALY_LIB_EMLEARN_MODEL_PATH="emlearn_model.gz"
    harness: robot
    harness_config:
      robot_testsuite: emlearn.robot
  sample.anomaly.kenning.robot:
    extra_configs:
      - CONFIG_CPP=y
      - CONFIG_STD_CPP17=y
      - CONFIG_NEWLIB_LIBC=y
      - CONFIG_NEWLIB_LIBC_NANO=y
      - CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
      - CONFIG_MAIN_STACK_SIZE=4096
      - CONFIG_SERIAL=y
      - CONFIG_FPU=y
      - CONFIG_BUILD_WITH_TFM=n
      - CONFIG_HEAP_MEM_POOL_SIZE=2048
      - CONFIG_KENNING_INFERENCE_LIB=y
      - CONFIG_KENNING_ML_RUNTIME_TFLITE=y
      - CONFIG_KENNING_TFLITE_BUFFER_SIZE=40
      - CONFIG_ANOMALY_LIB_BACKEND_KENNING=y
      - CONFIG_KENNING_MODEL_PATH="kenning_tflite_model.tflite"
    harness: robot
    harness_config:
      robot_testsuite: kenning.robot
