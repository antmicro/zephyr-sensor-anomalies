sample:
  name: anomaly-cb
common:
  platform_allow:
    - stm32f746g_disco
tests:
  sample.anomalycb.kenning.robot:
    harness: robot
    harness_config:
      robot_testsuite: kenning.robot
  sample.anomalycb.kenning.exp_smoothing.robot:
    extra_configs:
      - CONFIG_CLASSIFIER_USE_EXP_MOVING_AVERAGES=y
      - CONFIG_CLASSIFIER_EXP_MOVING_AVERAGES_SMOOTHING_PERCENT=30
    harness: robot
    harness_config:
      robot_testsuite: kenning.exp_smoothing.robot
