name: Running README sample workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  readme-test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Increase build space
        run: |
          echo "Before cleanup"
          df -H
          sudo rm -rf /opt/ggc
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          echo "After cleanup"
          df -H
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          sudo apt update -qqy
          sudo apt install -qqy python3 python3-pip git curl
          sudo python3 -m pip config set global.break-system-packages true
          sudo python3 -m pip install setuptools pip
          sudo python3 -m pip install git+https://github.com/antmicro/tuttest.git
      - name: Run tuttest
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH=$HOME/.local/bin:$PATH
          bash <(echo -e 'set -ex\n' && tuttest --language bash README.md | grep -v '^\$')
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minispot_report
          path: report/report
