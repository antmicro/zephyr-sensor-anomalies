name: Running README sample workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  readme-test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          apt update -qqy
          apt install -qqy python3 python3-pip git curl
          python3 -m pip config set global.break-system-packages true
          python3 -m pip install setuptools pip
          python3 -m pip install git+https://github.com/antmicro/tuttest.git
      - name: Run tuttest
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source $HOME/.local/bin/env
          bash <(echo -e 'set -ex\n' && tuttest --language bash README.md | grep -v '^\$')
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minispot_report
          path: report/report
