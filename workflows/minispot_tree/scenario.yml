platform:
  type: ZephyrPlatform
  parameters:
    name: stm32f746g_disco
    simulated: true
    zephyr_build_path: ../../build
    sensors:
      - i2c1.lis2ds12_1
      - i2c1.lis2ds12_2
    sensors_frequency: 102
    runtime_init_log_msg: "*** Booting Zephyr OS build"
    disable_profiler: true
model_wrapper:
  type: StubEmlearnModel
  parameters:
    model_path: ./model.gz
    in_features: 6
    out_features: 2
dataset:
  type: TabularDataset
  parameters:
    dataset_root: build/data
    dataset_path: "./data_test.csv"
    cols_x: ["roll", 'pitch', 'gz', 'ax', 'ay', 'az']
    col_y: "anomaly"
    shuffle_data: False
inference_loop:
  type: AnomalyDetectionInferenceLoop
  parameters:
    inference_limit: 512
